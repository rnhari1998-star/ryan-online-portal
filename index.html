<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free Education and Online Test Portal for RYAN Group of Institutions">
  <meta name="keywords" content="Education, Online Test, RYAN, Students, Teachers">
  <title>RYAN Group of Institutions - Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #4b0082, #6a0dad);
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #4b0082;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header img {
      height: 50px;
      margin-right: 10px;
    }
    .login-box {
      background: #fff;
      color: #000;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .btn-login {
      background-color: #4b0082;
      color: #fff;
      width: 100%;
    }
    .hero {
      text-align: center;
      margin-top: 40px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .features {
      display: flex;
      justify-content: center;
      margin: 40px 0;
    }
    .feature {
      background: #fff;
      color: #000;
      margin: 10px;
      padding: 20px;
      border-radius: 8px;
      flex: 1;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="d-flex align-items-center">
      <img src="logo.jpg" alt="RYAN Logo">
      <span><strong>RYAN GROUP OF INSTITUTIONS</strong></span>
    </div>
    <button class="btn btn-warning">Login</button>
  </header>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Learn. Practice. Achieve.</h1>
    <p>Tuition • Coaching • Online Tests • Results • Teacher Portal</p>
    <a href="#login" class="btn btn-warning">Open Portal</a>
  </div>

  <!-- Login Box -->
  <div id="login" class="login-box">
    <h2>Portal Login</h2>
    <form action="/login" method="POST">
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn btn-login">Login</button>
    </form>
  </div>

  <!-- Features -->
  <div class="features">
    <div class="feature">
      <h3>Tuition</h3>
      <p>Courses and study support.</p>
    </div>
    <div class="feature">
      <h3>Online Tests</h3>
      <p>Timed MCQ tests and automatic results.</p>
    </div>
    <div class="feature">
      <h3>Performance</h3>
      <p>Student results and fee records.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
